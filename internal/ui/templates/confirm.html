{{ define "content" }}{{ template "app_shell" . }}{{ end }}
{{ define "page" }}
  <div class="mx-auto max-w-xl">
    <section class="glass-panel rounded-[28px] p-6 sm:p-8">
      <div class="mb-6">
        <p class="text-sm font-semibold text-rose-600 dark:text-rose-300">Confirm action</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-normal text-zinc-950 dark:text-white">{{ index .Form "heading" }}</h1>
        <p class="mt-3 text-sm leading-6 text-zinc-500 dark:text-zinc-400">{{ index .Form "message" }}</p>
      </div>
      <div class="rounded-2xl border border-zinc-200 bg-white p-4 text-sm font-semibold text-zinc-950 dark:border-zinc-800 dark:bg-zinc-950 dark:text-white">{{ index .Form "subject" }}</div>
      <form class="mt-7 flex items-center justify-between gap-3" method="post" action="{{ index .Form "action" }}">
        <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
        {{ if index .Form "subnet_id" }}<input type="hidden" name="subnet_id" value="{{ index .Form "subnet_id" }}">{{ end }}
        {{ if index .Form "device_id" }}<input type="hidden" name="device_id" value="{{ index .Form "device_id" }}">{{ end }}
        <a class="button-muted" href="{{ index .Form "cancel" }}">Cancel</a>
        <button class="inline-flex h-11 items-center justify-center rounded-xl bg-rose-600 px-5 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-700 focus:outline-none focus:ring-4 focus:ring-rose-300 dark:focus:ring-rose-900" type="submit">{{ index .Form "confirm_text" }}</button>
      </form>
    </section>
  </div>
{{ end }}
