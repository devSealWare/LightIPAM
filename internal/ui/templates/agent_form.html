{{ define "content" }}{{ template "app_shell" . }}{{ end }}
{{ define "page" }}
  <div class="mx-auto max-w-3xl">
    <header class="mb-5 flex items-center justify-between">
      <div>
        <a class="text-sm font-medium text-zinc-500 hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white" href="/agents">Agents</a>
        <h1 class="mt-2 text-3xl font-semibold tracking-normal text-zinc-950 dark:text-white">{{ .Title }}</h1>
      </div>
      {{ if .ScanAgent.ID }}
      <a class="text-sm font-medium text-rose-600 hover:text-rose-700 dark:text-rose-300" href="/agents/{{ .ScanAgent.ID }}/delete">Delete</a>
      {{ end }}
    </header>

    <form method="post" action="{{ if .ScanAgent.ID }}/agents/{{ .ScanAgent.ID }}{{ else }}/agents{{ end }}" class="glass-panel rounded-[28px] p-6 sm:p-8">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      {{ if .Error }}
      <div class="mb-5 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700 dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-200">{{ .Error }}</div>
      {{ end }}
      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Name</span>
          <input class="form-input" name="name" value="{{ index .Form "name" }}" required>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Status</span>
          <select class="form-input" name="status">
            {{ range .AgentStatuses }}
            <option value="{{ . }}" {{ if eq . (index $.Form "status") }}selected{{ end }}>{{ . }}</option>
            {{ end }}
          </select>
        </label>
        <label class="block sm:col-span-2">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Endpoint URL</span>
          <input class="form-input font-mono" name="endpoint_url" value="{{ index .Form "endpoint_url" }}" placeholder="https://scanner-agent:8443" required>
        </label>
        <label class="block sm:col-span-2">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Certificate subject (CN)</span>
          <input class="form-input font-mono" name="certificate_subject" value="{{ index .Form "certificate_subject" }}" placeholder="light-ipam-scanner-agent">
          <span class="mt-1 block text-xs text-zinc-400">The agent's expected certificate identity. Optional — set it to verify the agent more strictly.</span>
        </label>
        <label class="block sm:col-span-2">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Allowed IPv4 CIDRs</span>
          <textarea class="form-input min-h-24 py-3 font-mono text-sm" name="allowed_cidrs" placeholder="192.168.0.0/16&#10;10.0.0.0/8">{{ index .Form "allowed_cidrs" }}</textarea>
          <span class="mt-1 block text-xs text-zinc-400">One per line. The agent only scans addresses within these ranges.</span>
        </label>
        <div class="sm:col-span-2 rounded-2xl border border-zinc-200 bg-white/40 px-4 py-3 dark:border-zinc-800 dark:bg-zinc-900/40">
          <label class="flex items-start gap-3">
            <input class="mt-0.5 h-4 w-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-400 dark:border-zinc-600" type="checkbox" name="auto_import" {{ if eq (index .Form "auto_import") "on" }}checked{{ end }}>
            <span>
              <span class="block text-sm font-medium text-zinc-700 dark:text-zinc-200">Auto-import trusted discoveries</span>
              <span class="mt-1 block text-xs leading-5 text-zinc-400">Skip the review queue for this agent: new and matching hosts are written straight into IPAM. Conflicts (a changed MAC, a deprecated address still responding) always stay in <span class="font-mono">/discoveries</span> for you to resolve.</span>
            </span>
          </label>
        </div>
      </div>
      <div class="mt-7 flex items-center justify-between gap-3">
        <a class="button-muted" href="/agents">Cancel</a>
        <button class="button-primary" type="submit">Save agent</button>
      </div>
    </form>
  </div>
{{ end }}
