{{ define "content" }}{{ template "app_shell" . }}{{ end }}
{{ define "page" }}
  <div class="mx-auto max-w-3xl">
    <header class="mb-5">
      <a class="text-sm font-medium text-zinc-500 hover:text-zinc-950 dark:text-zinc-400 dark:hover:text-white" href="/subnets/{{ .Subnet.ID }}">{{ .Subnet.Name }}</a>
      <h1 class="mt-2 text-3xl font-semibold tracking-normal text-zinc-950 dark:text-white">{{ .Title }}</h1>
    </header>

    <form method="post" action="/addresses/{{ .Address.ID }}" class="glass-panel rounded-[28px] p-6 sm:p-8">
      <input type="hidden" name="csrf_token" value="{{ .CSRF }}">
      {{ if .Error }}
      <div class="mb-5 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700 dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-200">{{ .Error }}</div>
      {{ end }}
      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">IPv4 address</span>
          <input class="form-input font-mono" name="address" value="{{ index .Form "address" }}" required>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">State</span>
          <select class="form-input" name="state">
            {{ range .AddressStates }}
            <option value="{{ . }}" {{ if eq . (index $.Form "state") }}selected{{ end }}>{{ . }}</option>
            {{ end }}
          </select>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Hostname</span>
          <input class="form-input" name="hostname" value="{{ index .Form "hostname" }}">
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Device</span>
          <select class="form-input" name="device_id">
            <option value="">Unassigned</option>
            {{ range .Devices }}
            <option value="{{ .ID }}" {{ if eq .ID (index $.Form "device_id") }}selected{{ end }}>{{ .Name }}</option>
            {{ end }}
          </select>
        </label>
        <label class="block sm:col-span-2">
          <span class="mb-2 block text-sm font-medium text-zinc-700 dark:text-zinc-200">Notes</span>
          <textarea class="form-input min-h-28 py-3" name="notes">{{ index .Form "notes" }}</textarea>
        </label>
      </div>
      {{ template "custom_fields_form" .CustomFields }}
      <div class="mt-7 flex items-center justify-between gap-3">
        <a class="button-muted" href="/subnets/{{ .Subnet.ID }}">Cancel</a>
        <button class="button-primary" type="submit">Save address</button>
      </div>
    </form>
  </div>
{{ end }}
