# Macvlan overlay for the scanner-agent.
#
# Why: on a plain Docker bridge the agent reaches scan targets as NAT'd, routed
# TCP. That is fine for service/version detection (`-sV`), but nmap never sees
# the target's ARP reply, so observations come back with **no MAC address**.
# Imports without a MAC create only an IP address record — never a device
# (see internal/store/discoveries.go: importDiscoveryDevice returns early when
# discovery.MAC == ""). To populate Devices automatically, the agent needs
# layer-2 (ARP) visibility of the LAN.
#
# This overlay keeps the agent on the default bridge for the control-plane
# (the app still reaches it at https://scanner-agent:8443 over mTLS — so NO
# certificate/SAN change is needed) and ALSO joins it to the physical LAN via a
# macvlan, giving it a real LAN IP. nmap then routes LAN-subnet targets out the
# macvlan interface (directly connected → ARP works → MAC is reported), while
# app↔agent traffic stays on the bridge.
#
# Because the agent is dual-homed, its DEFAULT route points at the bridge. Left
# alone, nmap's SYN/OS probes to a *same-subnet* target can leave (or have their
# replies return on) the bridge instead of the macvlan, so service/OS detection
# silently comes back empty even though the ARP ping reports the MAC. The agent
# fixes that by resolving AGENT_SCAN_SOURCE_IP (below) to the macvlan interface
# and, by default, pinning only targets inside that source subnet. Routed targets
# stay unpinned and use the kernel's default route.
#
# Usage (alongside the base compose, not instead of it):
#
#   docker compose -f compose.yaml -f deploy/compose.scanner-macvlan.yaml \
#     --profile scanner up -d
#
# Set the four LAN-specific values in a .env file beside compose.yaml (it is
# gitignored, so a later `git pull` will NOT clobber them). See .env.example:
#   - SCAN_LAN_PARENT   : the host NIC on the LAN you scan (e.g. eth0, eno1,
#       enp3s0, enx9c69d34b02e2 — `ip -br link` lists them). MUST be a real
#       interface on this host, or Docker rejects the network with
#       "invalid subinterface vlan name".
#   - SCAN_LAN_SUBNET   : the LAN subnet in CIDR form (match your real LAN).
#   - SCAN_LAN_GATEWAY  : the LAN's gateway.
#   - SCAN_LAN_AGENT_IP : a FREE address on that subnet, ideally outside the DHCP
#       pool so nothing else claims it.
#
# Make sure AGENT_ALLOWED_CIDRS (in compose.yaml) contains the LAN subnet; the
# default "192.168.0.0/16,10.0.0.0/8" already covers most home/SMB ranges.
#
# Note: by Docker's macvlan design the *host* cannot talk to the agent over the
# macvlan interface (and vice versa). That is intentional and harmless here —
# the host/app reach the agent over the bridge, and the macvlan is used only for
# the agent's outbound scans of the LAN.
#
# AGENT_SCAN_PIN_MODE defaults to auto. Same-subnet targets are pinned to the
# macvlan so ARP/MAC and service/OS detection agree; routed targets are scanned
# unpinned over the default route. That makes routed service/OS scans work from a
# macvlan agent, but MAC discovery still requires L2 adjacency, a gateway
# SNMP/ARP-table scan (arp_table), or one scanner per VLAN. Set
# AGENT_SCAN_PIN_MODE=always only when every target is on this macvlan segment.

services:
  scanner-agent:
    environment:
      # Pin nmap's raw probes to the macvlan LAN interface. A dual-homed agent's
      # default route points at the control-plane bridge, so without this a
      # *same-subnet* target's service/OS detection silently returns nothing even
      # though ARP/MAC succeeds. In the default auto pin mode, only targets inside
      # this source subnet are pinned; routed targets run over the default route.
      # The agent resolves the interface that owns this IP, so only the address is
      # needed here.
      AGENT_SCAN_SOURCE_IP: ${SCAN_LAN_AGENT_IP:-192.168.0.250}
    networks:
      # Control-plane: unchanged bridge reachability for app -> agent mTLS.
      default: {}
      # Data-plane: real LAN presence so nmap can ARP and report MACs.
      scan_lan:
        ipv4_address: ${SCAN_LAN_AGENT_IP:-192.168.0.250}

networks:
  scan_lan:
    driver: macvlan
    driver_opts:
      parent: ${SCAN_LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${SCAN_LAN_SUBNET:-192.168.0.0/24}
          gateway: ${SCAN_LAN_GATEWAY:-192.168.0.1}
