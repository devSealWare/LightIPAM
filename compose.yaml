services:
  app:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://netventory:netventory@db:5432/netventory?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netventory
      POSTGRES_USER: netventory
      POSTGRES_PASSWORD: netventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netventory -d netventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

