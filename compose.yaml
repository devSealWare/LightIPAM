services:
  app:
    build:
      context: .
      args:
        # Stamp a version into the binary: `VERSION=v1.0.0 docker compose build`.
        VERSION: ${VERSION:-dev}
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lightipam:lightipam@db:5432/lightipam?sslmode=disable
      APP_SECRET: change-me-in-production
      # Client identity for dispatching scan jobs to agents over mTLS. If these
      # files are absent the app still boots and scan jobs fail cleanly.
      SCANNER_CLIENT_CERT: /certs/app.crt
      SCANNER_CLIENT_KEY: /certs/app.key
      SCANNER_CLIENT_CA: /certs/ca.crt
      # Endpoint of the bundled agent. On boot the app pulls the agent's
      # self-reported identity over mTLS and auto-enrolls it as a pending agent,
      # so an operator only has to approve it. Leave unset to disable auto-enroll.
      SCANNER_AGENT_ENDPOINT: https://scanner-agent:8443
      # Where in-app pg_dump backups are written. Backed by the named "backups"
      # volume below so they survive container restarts. pg_dump is a plain DB
      # client — the app still runs with zero Linux capabilities.
      BACKUP_DIR: /var/lib/lightipam/backups
    ports:
      # Host port is configurable so deployments whose 8080 is taken can publish
      # elsewhere without editing this file (which a git pull would clobber). Set
      # APP_PORT in a .env file next to this compose file; the container always
      # listens on 8080 internally. Example: APP_PORT=31415
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      # Normalize cert ownership before boot — the app reads its mTLS client key
      # once at startup, so the key must be readable by then. See cert-perms below.
      cert-perms:
        condition: service_completed_successfully
    # Liveness is /healthz; readiness is /readyz, which also pings the database
    # and reports the applied migration version, so orchestration only sends
    # traffic once the app can actually serve it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./deploy/scanner-certs:/certs:ro
      - backups:/var/lib/lightipam/backups
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # One-shot init that normalizes scanner cert ownership so the unprivileged app
  # and agent (cap_drop: ALL) can read their 0600 private keys. On a Linux host a
  # bind mount keeps the keys owned by the operator, and without CAP_DAC_OVERRIDE
  # the in-container root cannot read them — the agent would crash with
  # "read server key ... permission denied". This service gives each key to the
  # uid that reads it (agent.key -> root, app.key -> the app's pinned uid 100),
  # then exits, so the real services start with readable keys. It re-runs on every
  # `up`, so it also self-heals after a cert regeneration. It is the ONLY component
  # allowed to change ownership, and holds just CHOWN + FOWNER for that millisecond.
  # Tolerates absent certs (no-op), so the default app+db stack is unaffected.
  # macOS / Docker Desktop never hit this; it is a native-Linux concern. ADR 0025.
  cert-perms:
    image: alpine:3.20
    command: ["sh", "/fix-cert-perms.sh", "/certs"]
    volumes:
      - ./deploy/fix-cert-perms.sh:/fix-cert-perms.sh:ro
      - ./deploy/scanner-certs:/certs
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Optional active-discovery agent. Started only with the "scanner" profile so
  # the default app+db stack stays unchanged. Requires mTLS material generated
  # by `go run ./cmd/scanner-certs` into ./deploy/scanner-certs first.
  # See docs/SCANNER_AGENT.md.
  scanner-agent:
    build:
      context: .
      dockerfile: Dockerfile.scanner
      args:
        VERSION: ${VERSION:-dev}
    profiles:
      - scanner
    depends_on:
      # Wait for cert ownership to be normalized so the agent can read agent.key.
      cert-perms:
        condition: service_completed_successfully
    environment:
      AGENT_LISTEN: ":8443"
      AGENT_ID: agent-local
      AGENT_NAME: local-scanner-agent
      AGENT_ALLOWED_CIDRS: "192.168.0.0/16,10.0.0.0/8"
      APP_CLIENT_CN: light-ipam-app
      SCANNER_TLS_CERT: /certs/agent.crt
      SCANNER_TLS_KEY: /certs/agent.key
      SCANNER_TLS_CA: /certs/ca.crt
      # SNMP discovery (arp_table, snmp_inventory, and lldp_cdp scan types): over
      # UDP/161 the agent harvests a gateway's neighbor cache for IP↔MAC pairs
      # (arp_table), reads a device's own identity + interfaces (snmp_inventory),
      # and maps a switch/router's LLDP/CDP neighbors / physical topology
      # (lldp_cdp). v2c read-only; set the community to match your devices. The
      # credential stays on the agent, never the app.
      AGENT_SNMP_VERSION: "2c"
      AGENT_SNMP_COMMUNITY: "public"
      # NetBIOS/mDNS name resolution (name_lookup scan type, also part of a
      # combined scan): the agent asks each host for its own name over UDP/137
      # (NetBIOS) and UDP/5353 (mDNS), recovering names for hosts with no DNS PTR
      # record. Unprivileged unicast UDP — no NET_RAW. Ports/timeout are tunable:
      #   AGENT_NETBIOS_PORT (137), AGENT_MDNS_PORT (5353), AGENT_NAME_TIMEOUT (2s)
      # DNS name enrichment (dns_lookup scan type, also part of a combined scan):
      # the agent resolves each host's name from DNS (reverse PTR) and forward-
      # confirms it. Unprivileged UDP/TCP/53 — no NET_RAW. Tunable:
      #   AGENT_DNS_SERVER (system resolver by default), AGENT_DNS_TIMEOUT (3s)
      # DHCP lease ingestion (dhcp_leases scan type, also part of a combined scan):
      # the agent reads the DHCP server's lease file for authoritative IP↔MAC and
      # client hostnames. Opt-in — set AGENT_DHCP_LEASE_FILE and mount the file
      # read-only (see the volumes example below). Reading a file needs no NET_RAW.
      #   AGENT_DHCP_LEASE_FILE (unset = idle), AGENT_DHCP_LEASE_FORMAT (isc|dnsmasq|auto)
      # AGENT_DHCP_LEASE_FILE: /leases/dnsmasq.leases
    volumes:
      - ./deploy/scanner-certs:/certs:ro
      # To enable dhcp_leases, mount the DHCP server's lease file read-only and set
      # AGENT_DHCP_LEASE_FILE above to the in-container path, e.g.:
      # - /var/lib/misc/dnsmasq.leases:/leases/dnsmasq.leases:ro
    read_only: true
    # Active discovery needs raw sockets for ARP/SYN/OS probes. NET_RAW is
    # granted here — and only here — while every other capability stays dropped.
    # The web app service above carries no capabilities.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    # The agent's endpoints require a verified client cert, so a plain wget/nc
    # cannot probe them. `scanner-agent --healthcheck` self-dials the listen port
    # instead, so `docker compose ps` shows the agent unhealthy/exited rather than
    # leaving a stopped agent to surface only as a DNS failure from the app.
    healthcheck:
      test: ["CMD", "scanner-agent", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightipam
      POSTGRES_USER: lightipam
      POSTGRES_PASSWORD: lightipam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightipam -d lightipam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  backups:
