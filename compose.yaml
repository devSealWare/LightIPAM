services:
  app:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lightipam:lightipam@db:5432/lightipam?sslmode=disable
      APP_SECRET: change-me-in-production
      # Client identity for dispatching scan jobs to agents over mTLS. If these
      # files are absent the app still boots and scan jobs fail cleanly.
      SCANNER_CLIENT_CERT: /certs/app.crt
      SCANNER_CLIENT_KEY: /certs/app.key
      SCANNER_CLIENT_CA: /certs/ca.crt
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/scanner-certs:/certs:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional active-discovery agent. Started only with the "scanner" profile so
  # the default app+db stack stays unchanged. Requires mTLS material generated
  # by `go run ./cmd/scanner-certs` into ./deploy/scanner-certs first.
  # See docs/SCANNER_AGENT.md.
  scanner-agent:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    profiles:
      - scanner
    environment:
      AGENT_LISTEN: ":8443"
      AGENT_ID: agent-local
      AGENT_NAME: local-scanner-agent
      AGENT_ALLOWED_CIDRS: "192.168.0.0/16,10.0.0.0/8"
      APP_CLIENT_CN: light-ipam-app
      SCANNER_TLS_CERT: /certs/agent.crt
      SCANNER_TLS_KEY: /certs/agent.key
      SCANNER_TLS_CA: /certs/ca.crt
    volumes:
      - ./deploy/scanner-certs:/certs:ro
    read_only: true
    # No extra capabilities: the no-op agent does not scan yet. NET_RAW will be
    # added here (and only here) when Nmap-based discovery lands.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightipam
      POSTGRES_USER: lightipam
      POSTGRES_PASSWORD: lightipam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightipam -d lightipam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
