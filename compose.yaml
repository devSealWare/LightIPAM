services:
  app:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lightipam:lightipam@db:5432/lightipam?sslmode=disable
      APP_SECRET: change-me-in-production
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightipam
      POSTGRES_USER: lightipam
      POSTGRES_PASSWORD: lightipam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightipam -d lightipam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
