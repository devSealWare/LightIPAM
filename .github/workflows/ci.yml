name: ci

# Build, test, and format checks for every pull request and every push to main.
# This workflow does NOT publish anything — image publishing lives only in
# release.yml and runs on pushed v* tags. Keep the steps here in sync with
# docs/agent/VALIDATION.md.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Go build, vet, test, gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node toolchain
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l internal cmd)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
          - name: scanner
            dockerfile: Dockerfile.scanner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only (push: false). Publishing happens in release.yml on a tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: lightipam-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
