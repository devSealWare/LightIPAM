name: release

# Cut a release by pushing a SemVer tag, e.g.:
#   git tag -a v1.0.0 -m "Light IPAM v1.0.0" && git push origin v1.0.0
# This runs the test suite, then builds and pushes multi-arch app + scanner
# images to the GitHub Container Registry (GHCR), stamping the tag as the build
# version. A non-prerelease tag (v1.0.0) also moves the `latest` tag; a
# prerelease (v1.0.0-rc.1) does not.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: lightipam
            dockerfile: Dockerfile
          - name: lightipam-scanner
            dockerfile: Dockerfile.scanner
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR requires lowercase) and
      # derives tags from the git tag: 1.0.0, 1.0, and latest (auto, non-prerelease).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
